<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayOrg Dashboard</title>
<style>
:root{--bg:#0d0f10;--panel:#151718;--line:#34383a;--text:#f1f1f1;--muted:#a1a5a7;--purple:#6d00c7;--purple2:#8b19e6;--green:#27d17f;--red:#ff5b67}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;color:var(--text);background:#171a1b;border:1px solid var(--line);border-radius:4px;padding:9px 14px}button:hover{border-color:#626668;background:#1c1f20}.primary{background:var(--purple);border-color:var(--purple)}.primary:hover{background:var(--purple2)}.danger{color:#ff8990}.muted{color:var(--muted)}a{color:#c7a0ff;text-decoration:none}
.app{display:grid;grid-template-columns:294px 1fr;min-height:100vh}.sidebar{background:#0b0c0d;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;font-weight:700}.brand-mark{width:24px;height:24px;border-radius:6px;background:#eee;color:#111;display:grid;place-items:center;margin-right:11px;font-size:12px}.workspace{padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}.workspace strong{display:block;margin-bottom:4px}.nav{padding:12px 10px}.nav-title{font-size:11px;letter-spacing:.08em;color:#777d80;text-transform:uppercase;padding:12px 10px 7px}.nav button{width:100%;border:0;text-align:left;background:transparent;padding:10px;border-radius:3px;color:#d5d7d8}.nav button:hover,.nav button.active{background:#2a004c;color:#fff}.nav button span{margin-right:10px;color:#a8abad}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px}.main{min-width:0}.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0c0d0e}.top-left{display:flex;align-items:center;gap:12px}.crumb{font-size:14px;color:#ddd}.search{display:flex;gap:10px;align-items:center}.search input{background:transparent;border:0;color:#ddd;width:170px;outline:0}.content{max-width:1120px;margin:0 auto;padding:38px 48px 70px}.page-title{font-size:34px;font-weight:500;margin:0 0 32px}.section-title{font-size:20px;font-weight:600;margin:0 0 18px}.projects-box{border:1px solid #4a4d4e;background:#111314;padding:26px}.create-card{height:96px;border:1px dashed #666;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}.create-card:hover{background:#17191a;border-color:#aaa}.services-head{display:flex;justify-content:space-between;align-items:center;margin:34px 0 14px}.filters{display:flex;border:1px solid var(--line);width:max-content}.filters button{border:0;border-radius:0;padding:8px 13px}.filters button.active{background:#2a004c;color:#fff}.service-table{border:1px solid var(--line);background:#111314}.service-row{display:grid;grid-template-columns:1.7fr .8fr .8fr .8fr .7fr 34px;gap:16px;align-items:center;padding:16px 18px;border-top:1px solid #2f3233}.service-row:first-child{border-top:0}.service-row.header{font-size:11px;text-transform:uppercase;color:#898d8f;padding:12px 18px}.service-name{font-size:15px;text-decoration:underline}.status{display:inline-flex;align-items:center;gap:7px;color:#39e18e}.dot{width:8px;height:8px;background:var(--green);border-radius:50%}.runtime{font-size:12px;border:1px solid var(--line);padding:4px 7px;width:max-content}.menu{color:#999;font-size:20px}.empty{padding:45px;text-align:center;color:var(--muted)}
.form-shell{max-width:900px}.back{margin-bottom:25px}.form-title{font-size:28px;font-weight:500;margin:0 0 30px}.source{border:1px solid var(--line);padding:15px 18px;background:#141617;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center}.field{margin-bottom:22px}.field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}.field .help{display:block;color:var(--muted);font-size:12px;margin-top:5px}.input,select{width:100%;height:42px;border:1px solid #4a4d4e;background:#101213;color:#eee;border-radius:3px;padding:0 12px;outline:0}.input:focus,select:focus{border-color:#9651d2}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}.env-section{border:1px solid var(--line);background:#111314;padding:22px;margin-top:26px}.env-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:9px}.check{display:flex;align-items:center;gap:7px;color:#bbb;font-size:12px}.advanced{border:1px solid var(--line);margin-top:20px}.advanced summary{padding:15px 18px;cursor:pointer;font-weight:600}.advanced-body{padding:0 18px 18px}.submit-row{margin-top:28px;display:flex;justify-content:space-between;align-items:center}.details-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.service-title{font-size:30px;font-weight:500;margin:0 0 8px}.badge{font-size:12px;border:1px solid #2c4d3d;background:#123020;color:#6ff0a8;padding:5px 9px;border-radius:3px}.url{margin-top:8px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:25px}.tabs button{border:0;border-radius:0;background:transparent;padding:12px 17px;color:#aaa}.tabs button.active{color:#fff;border-bottom:2px solid #a75ce5}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.info-card{border:1px solid var(--line);background:#111314;padding:20px}.info-card h3{font-size:14px;margin:0 0 18px}.kv{display:flex;justify-content:space-between;gap:25px;padding:9px 0;border-top:1px solid #292c2d;font-size:13px}.kv:first-of-type{border-top:0}.logbox{background:#090a0b;border:1px solid var(--line);padding:15px;min-height:360px;max-height:520px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;color:#d0d3d4}.toast{position:fixed;right:22px;bottom:22px;background:#202324;border:1px solid #555;padding:12px 16px;display:none;z-index:50}.mobile-menu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-menu{display:inline-block}.content{padding:28px 20px}.two,.detail-grid{grid-template-columns:1fr}.service-row{grid-template-columns:1fr 90px}.service-row>div:nth-child(3),.service-row>div:nth-child(4),.service-row>div:nth-child(5),.service-row.header{display:none}.env-row{grid-template-columns:1fr}.topbar{padding:0 12px}.search input{width:90px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">P</div>PlayOrg</div>
  <div class="workspace"><strong>Nived's workspace</strong><span class="muted">Self-hosted · xyz12.site</span></div>
  <nav class="nav">
    <button id="navProjects" class="active" onclick="showDashboard()"><span>◈</span>Projects</button>
    <button onclick="showNewService()"><span>＋</span>New Web Service</button>
    <div class="nav-title">Monitor</div>
    <button onclick="showDashboard()"><span>⌁</span>Logs</button>
    <button onclick="showDashboard()"><span>◔</span>Metrics</button>
    <div class="nav-title">Manage</div>
    <button onclick="showDashboard()"><span>⚙</span>Environment</button>
    <button onclick="showDashboard()"><span>↻</span>Deployments</button>
    <button onclick="showDashboard()"><span>□</span>Settings</button>
  </nav>
  <div class="sidebar-bottom"><button style="width:100%" onclick="showNewService()">＋ New</button></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="top-left"><button class="mobile-menu" onclick="document.querySelector('.sidebar').style.display='flex'">☰</button><span class="crumb" id="crumb">Projects</span></div>
    <div class="search"><span>⌕</span><input id="searchBox" placeholder="Search services" oninput="filterServices(this.value)"><button onclick="showNewService()">＋ New Web Service</button><span class="muted">N</span></div>
  </header>
  <div id="view"></div>
</main>
</div>
<div id="toast" class="toast"></div>
<script>
let projectsData=[];let selectedId=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt={}){opt.headers={'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function shell(content){$('view').innerHTML=`<div class="content">${content}</div>`}
async function showDashboard(){ $('crumb').textContent='Projects';$('navProjects').classList.add('active');shell(`<h1 class="page-title">Overview</h1><div class="section-title">Projects</div><div class="projects-box"><div class="create-card" onclick="showNewService()">＋ Create new web service</div></div><div class="services-head"><div><div class="section-title" style="margin-bottom:10px">Services</div><div class="filters"><button class="active">Active (<span id="activeCount">0</span>)</button><button>Suspended (0)</button><button>All (<span id="allCount">0</span>)</button></div></div><button onclick="loadProjects()">↻ Refresh</button></div><div class="service-table"><div class="service-row header"><div>Service name</div><div>Status</div><div>Runtime</div><div>Region</div><div>Updated</div><div></div></div><div id="serviceRows"></div></div>`);await loadProjects() }
function filterServices(q){document.querySelectorAll('.service-row:not(.header)').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'grid':'none')}
async function loadProjects(){try{const d=await api('/api/projects');projectsData=d.projects||[];const target=$('serviceRows');if(!target)return;const running=projectsData.filter(p=>p.running||p.status==='running').length;$('activeCount').textContent=running;$('allCount').textContent=projectsData.length;target.innerHTML=projectsData.length?projectsData.map(p=>`<div class="service-row" onclick="showService(${p.id})"><div><div class="service-name">${esc(p.name)}</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(p.repository)}</div></div><div class="status"><span class="dot" style="background:${(p.running||p.status==='running')?'var(--green)':'#777'}"></span>${esc(p.status||'created')}</div><div><span class="runtime">Node</span></div><div class="muted">Local</div><div class="muted">${esc(p.updated_at||'now')}</div><div class="menu">⋮</div></div>`).join(''):'<div class="empty">No services yet. Create your first web service.</div>'}catch(e){const t=$('serviceRows');if(t)t.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function showNewService(){ $('crumb').textContent='New Web Service';shell(`<div class="form-shell"><button class="back" onclick="showDashboard()">← Back to Projects</button><h1 class="form-title">New Web Service</h1><div class="source"><div><div style="font-weight:600">Source Code</div><div class="muted" style="font-size:12px;margin-top:4px">Connect a public Git repository</div></div><button>Edit</button></div><div class="field"><label>Name</label><input class="input" id="fName" placeholder="my-project"><span class="help">A unique name for your web service.</span></div><div class="field"><label>Repository URL</label><input class="input" id="fRepo" placeholder="https://github.com/user/repository.git"></div><div class="two"><div class="field"><label>Language</label><select class="input" id="fRuntime"><option>Node</option><option>Python</option><option>Other</option></select></div><div class="field"><label>Branch</label><input class="input" id="fBranch" value="main"></div></div><div class="field"><label>Region</label><div class="source" style="margin:0;padding:12px 14px"><div><strong>Local machine</strong><div class="muted" style="font-size:12px">Hosted by this PlayOrg server</div></div><span class="badge">LOCAL</span></div></div><div class="field"><label>Root Directory <span class="muted">Optional</span></label><input class="input" id="fRoot" placeholder="e.g. src"></div><div class="field"><label>Build Command</label><input class="input" id="fBuild" placeholder="npm install && npm run build"><span class="help">PlayOrg runs this command before each deployment.</span></div><div class="field"><label>Start Command</label><input class="input" id="fStart" value="npm start"><span class="help">PlayOrg runs this command to start your service.</span></div><div class="env-section"><h3 style="margin:0 0 6px">Environment Variables</h3><div class="muted" style="font-size:12px;margin-bottom:16px">Set environment variables and secrets that your application can read at build time and runtime.</div><div id="deployEnv"></div><button onclick="addDeployEnv()">＋ Add Environment Variable</button><button onclick="addEnvFromText()">Add from .env</button></div><details class="advanced"><summary>Advanced</summary><div class="advanced-body"><div class="field"><label>Health Check Path</label><input class="input" id="fHealth" value="/" placeholder="/healthz"></div><div class="field"><label>Pre-Deploy Command</label><input class="input" id="fPre" placeholder="Optional command"></div><div class="field"><label>Auto Deploy</label><select class="input" id="fAuto"><option value="true">On Commit</option><option value="false">Off</option></select></div></div></details><div class="submit-row"><span class="muted" id="deployMsg"></span><button class="primary" onclick="deployService()">Deploy Web Service</button></div></div>`);addDeployEnv('NODE_ENV','production',false) }
function addDeployEnv(n='',v='',secret=true){const d=document.createElement('div');d.className='env-row';d.innerHTML=`<input class="input env-name" placeholder="NAME_OF_VARIABLE" value="${esc(n)}"><input class="input env-value" placeholder="value" value="${esc(v)}" type="${secret?'password':'text'}"><label class="check"><input class="env-secret" type="checkbox" ${secret?'checked':''}> Secret</label>`;$('deployEnv').appendChild(d)}
function addEnvFromText(){const raw=prompt('Paste .env contents');if(!raw)return;raw.split(/\r?\n/).forEach(line=>{const m=line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$/);if(m)addDeployEnv(m[1],m[2].replace(/^[\'"]|[\'"]$/g,''),true)})}
function readEnv(){return [...document.querySelectorAll('#deployEnv .env-row')].map(r=>({name:r.querySelector('.env-name').value.trim(),value:r.querySelector('.env-value').value,isSecret:r.querySelector('.env-secret').checked})).filter(x=>x.name)}
async function deployService(){const msg=$('deployMsg');msg.textContent='Deploying...';try{const d=await api('/api/projects/deploy',{method:'POST',body:JSON.stringify({name:$('fName').value.trim(),repository:$('fRepo').value.trim(),branch:$('fBranch').value.trim()||'main',rootDirectory:$('fRoot').value.trim(),buildCommand:$('fBuild').value.trim(),startCommand:$('fStart').value.trim()||'npm start',autoDeploy:$('fAuto').value==='true',environmentVariables:readEnv()})});toast('Deployment started');showService(d.project.id)}catch(e){msg.textContent=e.message;toast(e.message)}}
async function showService(id){selectedId=id;$('crumb').textContent='Service';shell('<div class="empty">Loading service...</div>');try{const d=await api('/api/projects/'+id);const p=d.project;const ev=await api('/api/projects/'+id+'/env');shell(`<div class="details-head"><div><h1 class="service-title">${esc(p.name)}</h1><div class="status"><span class="dot"></span>${esc(p.status||'running')}</div><div class="url"><a href="http://${esc(p.name)}.xyz12.site" target="_blank">http://${esc(p.name)}.xyz12.site ↗</a></div></div><div><button onclick="showDashboard()">Back</button><button onclick="restartService(${p.id})">Manual Deploy</button><button class="danger" onclick="deleteService(${p.id})">Delete</button></div></div><div class="tabs"><button class="active" onclick="serviceTab('overview',${p.id})">Overview</button><button onclick="serviceTab('deployments',${p.id})">Deployments</button><button onclick="serviceTab('logs',${p.id})">Logs</button><button onclick="serviceTab('environment',${p.id})">Environment</button><button onclick="serviceTab('settings',${p.id})">Settings</button></div><div id="serviceTab"><div class="detail-grid"><div class="info-card"><h3>Service details</h3><div class="kv"><span>Repository</span><span>${esc(p.repository)}</span></div><div class="kv"><span>Branch</span><span>${esc(p.branch)}</span></div><div class="kv"><span>Runtime</span><span>Node</span></div><div class="kv"><span>Port</span><span>${esc(p.port)}</span></div><div class="kv"><span>Auto Deploy</span><span>${p.auto_deploy?'On':'Off'}</span></div></div><div class="info-card"><h3>Latest deployment</h3><div class="status"><span class="dot"></span>${esc(p.status||'running')}</div><p class="muted">Repository cloned and service process managed by PlayOrg.</p><button onclick="restartService(${p.id})">Redeploy</button><button onclick="stopService(${p.id})">Stop</button></div></div><div class="info-card" style="margin-top:18px"><h3>Environment Variables</h3><div class="muted">${ev.variables.length} configured variables</div><button style="margin-top:12px" onclick="serviceTab('environment',${p.id})">Manage Environment</button></div></div>`)}catch(e){shell(`<div class="empty">${esc(e.message)}</div>`)}}
async function serviceTab(tab,id){const box=$('serviceTab');if(tab==='overview')return showService(id);if(tab==='logs'){try{const r=await fetch('/api/projects/'+id+'/logs');box.innerHTML=`<div class="info-card"><h3>Runtime Logs</h3><div class="logbox">${esc(await r.text())||'No logs yet.'}</div></div>`}catch(e){box.textContent=e.message}}else if(tab==='environment'){const d=await api('/api/projects/'+id+'/env');box.innerHTML=`<div class="info-card"><h3>Environment Variables</h3><div id="manageEnv"></div><button onclick="addManageEnv()">＋ Add Environment Variable</button><button class="primary" onclick="saveManageEnv(${id})">Save Changes</button></div>`;d.variables.forEach(x=>addManageEnv(x.name,x.value,x.isSecret))}else if(tab==='settings'){const d=await api('/api/projects/'+id);const p=d.project;box.innerHTML=`<div class="info-card"><h3>Service Settings</h3><div class="two"><div class="field"><label>Branch</label><input class="input" id="sBranch" value="${esc(p.branch)}"></div><div class="field"><label>Root Directory</label><input class="input" id="sRoot" value="${esc(p.root_directory||'')}"></div></div><div class="field"><label>Build Command</label><input class="input" id="sBuild" value="${esc(p.build_command||'')}"></div><div class="field"><label>Start Command</label><input class="input" id="sStart" value="${esc(p.start_command||'npm start')}"></div><button class="primary" onclick="saveSettings(${id})">Save Settings</button></div>`}else if(tab==='deployments'){const d=await api('/api/projects/'+id);box.innerHTML=`<div class="info-card"><h3>Deployments</h3><div class="service-row" style="border:1px solid var(--line);margin-top:10px"><div><strong>Current deployment</strong><div class="muted">Managed by PlayOrg</div></div><div class="status"><span class="dot"></span>${esc(d.project.status)}</div><div>Node</div><div>Local</div><div>Now</div></div></div>`}}
function addManageEnv(n='',v='',secret=true){const d=document.createElement('div');d.className='env-row';d.innerHTML=`<input class="input m-name" value="${esc(n)}" placeholder="NAME"><input class="input m-value" value="${esc(v==='••••••••'?'':v)}" type="${secret?'password':'text'}" placeholder="value"><label class="check"><input class="m-secret" type="checkbox" ${secret?'checked':''}> Secret</label>`;$('manageEnv').appendChild(d)}
async function saveManageEnv(id){for(const r of document.querySelectorAll('#manageEnv .env-row')){const n=r.querySelector('.m-name').value.trim();if(n)await api('/api/projects/'+id+'/env',{method:'PUT',body:JSON.stringify({name:n,value:r.querySelector('.m-value').value,isSecret:r.querySelector('.m-secret').checked})})}toast('Environment saved');serviceTab('environment',id)}
async function saveSettings(id){try{await api('/api/projects/'+id+'/settings',{method:'PUT',body:JSON.stringify({branch:$('sBranch').value,rootDirectory:$('sRoot').value,buildCommand:$('sBuild').value,startCommand:$('sStart').value})});toast('Settings saved');showService(id)}catch(e){toast(e.message)}}
async function restartService(id){try{await api('/api/projects/'+id+'/restart',{method:'POST'});toast('Service restarted');showService(id)}catch(e){toast(e.message)}}
async function stopService(id){try{await api('/api/projects/'+id+'/stop',{method:'POST'});toast('Service stopped');showService(id)}catch(e){toast(e.message)}}
async function deleteService(id){if(!confirm('Delete this service and its deployed files?'))return;try{await api('/api/projects/'+id,{method:'DELETE'});toast('Service deleted');showDashboard()}catch(e){toast(e.message)}}
showDashboard();
</script>
</body>
</html>
