<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayOrg</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#0b1020;color:#e8edf7}header{padding:22px 28px;border-bottom:1px solid #202a3d;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:auto;padding:28px}.card{background:#111a2c;border:1px solid #24314a;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}label{display:block;margin:10px 0 6px;color:#9eabc1}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #33415c;background:#0c1424;color:#fff}button{border:0;border-radius:9px;padding:10px 14px;background:#5b7cfa;color:#fff;cursor:pointer;margin:5px 5px 0 0}button.danger{background:#c84b61}.muted{color:#91a0b8}.status{display:inline-block;padding:4px 9px;border-radius:99px;background:#203a2b;color:#8fe0ad;font-size:12px}.project{padding:16px;border:1px solid #26344e;border-radius:12px}.project h3{margin:0 0 8px}.logs{white-space:pre-wrap;background:#070b13;border-radius:10px;padding:12px;max-height:300px;overflow:auto;font:12px ui-monospace,monospace}small{color:#8290a8}
</style></head><body><header><h1>🚀 PlayOrg</h1><span class="muted">Self-hosted web platform</span></header><main class="wrap"><section class="card"><h2>Deploy from Git</h2><div class="grid"><div><label>Project name</label><input id="name" placeholder="my-project"><label>Repository URL</label><input id="repo" placeholder="https://github.com/user/repo.git"><label>Branch</label><input id="branch" value="main"></div><div><label>Build command</label><input id="build" placeholder="npm install && npm run build"><label>Start command</label><input id="start" value="npm start"><label>Admin token, if enabled</label><input id="token" type="password"></div></div><button onclick="deploy()">Deploy project</button><span id="msg" class="muted"></span></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Projects</h2><button onclick="loadProjects()">Refresh</button></div><div id="projects" class="grid"></div></section><section class="card"><h2>Logs</h2><div id="logs" class="logs">Select a project to view logs.</div></section></main><script>
const api="";const tokenKey="playorg-token";document.getElementById('token').value=localStorage.getItem(tokenKey)||'';
function headers(){const t=document.getElementById('token').value;if(t)localStorage.setItem(tokenKey,t);return t?{'Content-Type':'application/json','x-playorg-token':t}:{'Content-Type':'application/json'}}
async function apiFetch(url,opt={}){opt.headers={...headers(),...(opt.headers||{})};const r=await fetch(api+url,opt);const d=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
async function loadProjects(){try{const d=await apiFetch('/api/projects');document.getElementById('projects').innerHTML=d.projects.length?d.projects.map(p=>`<div class="project"><h3>${esc(p.name)}</h3><span class="status">${esc(p.status)}</span><p class="muted">Port ${p.port} · ${esc(p.branch)}</p><small>${esc(p.repository)}</small><div><button onclick="logs(${p.id})">Logs</button><button onclick="restart(${p.id})">Restart</button><button onclick="stop(${p.id})">Stop</button><button class="danger" onclick="removeProject(${p.id})">Delete</button></div></div>`).join(''):'<p class="muted">No projects deployed yet.</p>'}catch(e){document.getElementById('projects').innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
async function deploy(){const msg=document.getElementById('msg');msg.textContent=' Deploying...';try{const d=await apiFetch('/api/projects/deploy',{method:'POST',body:JSON.stringify({name:name.value,repository:repo.value,branch:branch.value,buildCommand:build.value,startCommand:start.value})});msg.textContent=' Deployed on port '+d.project.port;await loadProjects()}catch(e){msg.textContent=' '+e.message}}
async function restart(id){try{await apiFetch('/api/projects/'+id+'/restart',{method:'POST'});await loadProjects()}catch(e){alert(e.message)}}
async function stop(id){try{await apiFetch('/api/projects/'+id+'/stop',{method:'POST'});await loadProjects()}catch(e){alert(e.message)}}
async function removeProject(id){if(!confirm('Delete this project and its files?'))return;try{await apiFetch('/api/projects/'+id,{method:'DELETE'});await loadProjects()}catch(e){alert(e.message)}}
async function logs(id){try{const r=await fetch('/api/projects/'+id+'/logs',{headers:headers()});document.getElementById('logs').textContent=await r.text()}catch(e){document.getElementById('logs').textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadProjects();setInterval(loadProjects,10000);
</script></body></html>
