<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayOrg</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#0b1020;color:#e8edf7}header{padding:18px 28px;border-bottom:1px solid #202a3d;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(10px);z-index:5}h1,h2,h3{margin-top:0}.wrap{max-width:1250px;margin:auto;padding:26px}.card{background:#111a2c;border:1px solid #24314a;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}label{display:block;margin:10px 0 6px;color:#9eabc1}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #33415c;background:#0c1424;color:#fff}button{border:0;border-radius:9px;padding:10px 14px;background:#5b7cfa;color:#fff;cursor:pointer;margin:5px 5px 0 0}button.secondary{background:#263650}button.danger{background:#c84b61}.muted{color:#91a0b8}.status{display:inline-block;padding:4px 9px;border-radius:99px;background:#203a2b;color:#8fe0ad;font-size:12px}.project{padding:16px;border:1px solid #26344e;border-radius:12px}.project h3{margin-bottom:7px}.logs{white-space:pre-wrap;background:#070b13;border-radius:10px;padding:12px;max-height:360px;overflow:auto;font:12px ui-monospace,monospace}.envrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin:8px 0}.tabs button.active{background:#5b7cfa}.pill{padding:3px 7px;border-radius:7px;background:#1c2940;color:#9fb0ca;font-size:12px}.notice{padding:10px;border-radius:9px;background:#17233a;color:#aebbd0;margin-top:10px}
</style></head><body><header><h1>🚀 PlayOrg</h1><span class="muted">Self-hosted deployment platform · xyz12.site</span></header><main class="wrap">
<section class="card"><h2>New Web Service</h2><div class="grid"><div><label>Project name</label><input id="name" placeholder="my-project"><label>Repository URL</label><input id="repo" placeholder="https://github.com/user/repo.git"><label>Branch</label><input id="branch" value="main"><label>Root directory</label><input id="root" placeholder="Leave empty for repository root"></div><div><label>Build command</label><input id="build" placeholder="npm install && npm run build"><label>Start command</label><input id="start" value="npm start"><label>Auto deploy</label><select id="auto"><option value="true">Yes</option><option value="false">No</option></select><label>Admin token, if enabled</label><input id="token" type="password"></div></div><h3 style="margin-top:20px">Environment Variables</h3><div id="deployEnv"></div><button class="secondary" onclick="addDeployEnv()">+ Add Environment Variable</button><br><button onclick="deploy()">Deploy Web Service</button><span id="msg" class="muted"></span></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Web Services</h2><button onclick="loadProjects()">Refresh</button></div><div id="projects" class="grid"></div></section>
<section class="card"><h2>Service Details</h2><div id="details" class="muted">Select a service.</div></section>
<section class="card"><h2>Runtime Logs</h2><div id="logs" class="logs">Select a project to view logs.</div></section>
</main><script>
const tokenKey='playorg-token';token.value=localStorage.getItem(tokenKey)||'';let selected=null;
function headers(){const t=token.value;if(t)localStorage.setItem(tokenKey,t);return t?{'Content-Type':'application/json','x-playorg-token':t}:{'Content-Type':'application/json'}}
async function apiFetch(url,opt={}){opt.headers={...headers(),...(opt.headers||{})};const r=await fetch(url,opt);const d=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addDeployEnv(n='',v='',secret=true){const d=document.createElement('div');d.className='envrow';d.innerHTML=`<input class="en" placeholder="NAME" value="${esc(n)}"><input class="ev" placeholder="value" value="${esc(v)}" type="${secret?'password':'text'}"><label style="margin:10px 0"><input class="es" type="checkbox" ${secret?'checked':''} style="width:auto"> Secret</label><button class="danger" onclick="this.parentElement.remove()">Remove</button>`;deployEnv.appendChild(d)}
function readDeployEnv(){return [...document.querySelectorAll('#deployEnv .envrow')].map(r=>({name:r.querySelector('.en').value.trim(),value:r.querySelector('.ev').value,isSecret:r.querySelector('.es').checked})).filter(x=>x.name)}
async function deploy(){msg.textContent=' Deploying...';try{const d=await apiFetch('/api/projects/deploy',{method:'POST',body:JSON.stringify({name:name.value,repository:repo.value,branch:branch.value,rootDirectory:root.value,buildCommand:build.value,startCommand:start.value,autoDeploy:auto.value==='true',environmentVariables:readDeployEnv()})});msg.textContent=` Deployed on port ${d.project.port}`;await loadProjects();selectProject(d.project.id)}catch(e){msg.textContent=' '+e.message}}
async function loadProjects(){try{const d=await apiFetch('/api/projects');projects.innerHTML=d.projects.length?d.projects.map(p=>`<div class="project"><h3>${esc(p.name)}</h3><span class="status">${esc(p.status)}</span> ${p.running?'<span class="pill">running</span>':''}<p class="muted">Port ${p.port} · ${esc(p.branch)} · Auto deploy ${p.auto_deploy?'ON':'OFF'}</p><small>${esc(p.repository)}</small><div><button onclick="selectProject(${p.id})">Manage</button><button onclick="logs(${p.id})">Logs</button><button onclick="restart(${p.id})">Restart</button><button class="secondary" onclick="stop(${p.id})">Stop</button><button class="danger" onclick="removeProject(${p.id})">Delete</button></div></div>`).join(''):'<p class="muted">No services deployed yet.</p>'}catch(e){projects.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
async function selectProject(id){selected=id;try{const d=await apiFetch('/api/projects/'+id);const p=d.project;const ev=await apiFetch('/api/projects/'+id+'/env');details.innerHTML=`<h3>${esc(p.name)}</h3><p class="muted">${esc(p.repository)} · port ${p.port}</p><div class="grid"><div><label>Branch</label><input id="sbranch" value="${esc(p.branch)}"><label>Root Directory</label><input id="sroot" value="${esc(p.root_directory||'')}"></div><div><label>Build Command</label><input id="sbuild" value="${esc(p.build_command)}"><label>Start Command</label><input id="sstart" value="${esc(p.start_command)}"></div></div><h3 style="margin-top:18px">Environment</h3><div id="settingsEnv"></div><button class="secondary" onclick="addSettingsEnv()">+ Add Variable</button><br><button onclick="saveSettings(${id})">Save Settings</button>`;for(const x of ev.variables)addSettingsEnv(x.name,x.value,x.isSecret)}catch(e){details.textContent=e.message}}
function addSettingsEnv(n='',v='',secret=true){const d=document.createElement('div');d.className='envrow';d.innerHTML=`<input class="sn" placeholder="NAME" value="${esc(n)}"><input class="sv" placeholder="value" value="${esc(v==='••••••••'?'':v)}" type="${secret?'password':'text'}"><label style="margin:10px 0"><input class="ss" type="checkbox" ${secret?'checked':''} style="width:auto"> Secret</label><button class="danger" onclick="this.parentElement.remove()">Remove</button>`;settingsEnv.appendChild(d)}
async function saveSettings(id){try{await apiFetch('/api/projects/'+id+'/settings',{method:'PUT',body:JSON.stringify({branch:sbranch.value,rootDirectory:sroot.value,buildCommand:sbuild.value,startCommand:sstart.value})});const rows=[...document.querySelectorAll('#settingsEnv .envrow')];for(const r of rows){const n=r.querySelector('.sn').value.trim();if(n)await apiFetch('/api/projects/'+id+'/env',{method:'PUT',body:JSON.stringify({name:n,value:r.querySelector('.sv').value,isSecret:r.querySelector('.ss').checked})})}alert('Settings saved. Restart the service to apply changes.');await loadProjects();selectProject(id)}catch(e){alert(e.message)}}
async function restart(id){try{await apiFetch('/api/projects/'+id+'/restart',{method:'POST'});await loadProjects()}catch(e){alert(e.message)}}async function stop(id){try{await apiFetch('/api/projects/'+id+'/stop',{method:'POST'});await loadProjects()}catch(e){alert(e.message)}}async function removeProject(id){if(!confirm('Delete this service and its files?'))return;try{await apiFetch('/api/projects/'+id,{method:'DELETE'});selected=null;details.textContent='Select a service.';await loadProjects()}catch(e){alert(e.message)}}async function logs(id){try{const r=await fetch('/api/projects/'+id+'/logs',{headers:headers()});logsBox=r;document.getElementById('logs').textContent=await r.text()}catch(e){document.getElementById('logs').textContent=e.message}}
loadProjects();setInterval(loadProjects,10000);
</script></body></html>
